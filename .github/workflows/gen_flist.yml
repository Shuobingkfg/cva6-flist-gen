name: gen-cva6-filelist

on:
  workflow_dispatch:

jobs:
  gen_flist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CVA6 (with submodules)
        uses: actions/checkout@v4
        with:
          repository: openhwgroup/cva6
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install bender via cargo (from git)
        shell: bash
        run: |
          set -euxo pipefail
          # Install bender from the git repo (picks current main)
          cargo install --git https://github.com/pulp-platform/bender.git bender
          bender --version

      - name: Show bender targets
        run: bender targets

      - name: Generate flist (try common targets)
        shell: bash
        run: |
          set -euxo pipefail
          for t in rtl default cva6; do
            if bender script flist -t "$t" > cva6_rtl.f 2>/dev/null; then
              echo "Generated flist with target: $t"
              break
            fi
          done
          test -s cva6_rtl.f
          head -n 40 cva6_rtl.f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cva6_rtl_f
          path: cva6_rtl.f
