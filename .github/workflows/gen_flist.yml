name: gen-cva6-filelist

on:
  workflow_dispatch:

jobs:
  gen_flist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CVA6 (with submodules)
        uses: actions/checkout@v4
        with:
          repository: openhwgroup/cva6
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install bender via cargo (from git)
        shell: bash
        run: |
          set -euxo pipefail
          cargo install --git https://github.com/pulp-platform/bender.git bender
          bender --version
          bender --help || true
          bender script --help || true

      - name: Generate flist
        shell: bash
        run: |
          set -euxo pipefail

          # Most bender versions support: bender script flist ...
          # Try without target first (some projects default correctly)
          if bender script flist > cva6_rtl.f 2>/dev/null; then
            echo "Generated flist with default target"
          else
            # Try common target names
            for t in rtl default cva6; do
              if bender script flist -t "$t" > cva6_rtl.f 2>/dev/null; then
                echo "Generated flist with target: $t"
                break
              fi
            done
          fi

          test -s cva6_rtl.f
          head -n 40 cva6_rtl.f

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cva6_rtl_f
          path: cva6_rtl.f
